name: "CI"

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  force-ci:
    name: "Force CI"
    if: github.event_name == 'push' || (github.event.action == 'labeled' && (github.event.label.name == 'force ci' || github.event.label.name == 'to merge'))
    uses: Koudmain/.github/.github/workflows/orchestrator-ci.yml@main
    permissions:
      pull-requests: write
    with:
      language: "node"
      run-precommit: true
    secrets: inherit

  unit-tests:
    name: "Unit tests + coverage"
    if: github.event_name == 'push' || (github.event.action == 'labeled' && (github.event.label.name == 'force ci' || github.event.label.name == 'to merge'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  e2e-tests:
    name: "E2E tests"
    if: github.event_name == 'push' || (github.event.action == 'labeled' && (github.event.label.name == 'force ci' || github.event.label.name == 'to merge'))
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koudmain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: redispassword
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Postgres database configuration for E2E tests
      DB_TEST_USER: postgres
      DB_TEST_PASSWORD: postgres
      DB_TEST_NAME: koudmain_test
      DB_TEST_HOST: localhost
      DB_TEST_DOCKER_PORT: 5432
      # Redis configuration for E2E tests
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      REDIS_DB: 0
      # JWT configuration for E2E tests
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # Mailer configuration for E2E tests
      MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
      MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
      MAIL_FROM_EMAIL: no-reply@koudmain.fr
      MAIL_FROM_NAME: Koudmain
      MAILER_TEST_ROUTE_ENABLED: false
      # Google Drive configuration for E2E tests
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REDIRECT_URI: https://developers.google.com/oauthplayground
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:test:migrate:ci
      - run: npm run db:test:seed:ci
      - run: npm run test:e2e:ci
  
  label-cleanup:
    name: "Label cleanup"
    needs: [force-ci, unit-tests, e2e-tests]
    if: always() && (github.event_name == 'push' || (github.event.action == 'labeled' && (github.event.label.name == 'force ci' || github.event.label.name == 'to merge')))
    uses: Koudmain/.github/.github/workflows/reusable-label-cleanup.yml@main
    permissions:
      pull-requests: write
    with:
      ci-failed: ${{ contains(needs.*.result, 'failure') }}
    secrets: inherit
